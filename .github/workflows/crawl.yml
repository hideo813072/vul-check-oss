name: crawl
on:
  schedule:
    - cron: "7 * * * *"   # 毎時7分 (UTC)。GitHubの混雑で数分〜十数分遅れることがある
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python crawler/crawl.py
      # 毎回コミットする(最終確認時刻の更新 + 60日無活動でスケジュールが止まるのを防ぐ)
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs/data
          git diff --cached --quiet || { git commit -m "crawl: $(date -u +%FT%TZ)"; git pull --rebase; git push; }
