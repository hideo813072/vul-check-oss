name: crawl
on:
  schedule:
    - cron: "7 * * * *"   # 毎時7分 (UTC)。GitHubの混雑で数分〜十数分遅れることがある
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python crawler/crawl.py
        env:
          CHANGES_FILE: ${{ runner.temp }}/changes.md
      # 毎回コミットする(最終確認時刻の更新 + 60日無活動でスケジュールが止まるのを防ぐ)
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs/data
          git diff --cached --quiet || { git commit -m "crawl: $(date -u +%FT%TZ)"; git pull --rebase; git push; }
      # 更新があれば Issue を作成 → GitHub からリポジトリ所有者へ通知メールが届く
      - name: notify (issue)
        if: hashFiles(format('{0}/changes.md', runner.temp)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "[Vuln Watch] 更新検出 $(date -u +%Y-%m-%d\ %H:%M) UTC" \
            --body-file "$RUNNER_TEMP/changes.md"
