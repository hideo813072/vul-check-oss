<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vuln Watch</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2129;--mute:#6b7280;--line:#e5e7eb;--new:#d97706;--newbg:#fef3c7;--ok:#16a34a;--err:#dc2626;--errbg:#fee2e2;--link:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--fg:#e6e8ec;--mute:#9aa1ad;--line:#2a2f38;--new:#fbbf24;--newbg:#3a2e0b;--ok:#4ade80;--err:#f87171;--errbg:#3b1414;--link:#7aa7ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:20px;margin:0}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.meta{color:var(--mute);font-size:13px}
button{font:inherit;font-size:13px;padding:4px 12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
.banner{padding:10px 14px;border-radius:8px;margin:10px 0;font-size:14px}
.banner.new{background:var(--newbg);color:var(--new)}
.banner.warn{background:var(--errbg);color:var(--err)}
.banner.none{background:var(--card);border:1px solid var(--line);color:var(--mute)}
section.p{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:14px 0;overflow:hidden}
section.p>h2{font-size:16px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.src{padding:10px 14px;border-top:1px solid var(--line)}
.src:first-of-type{border-top:0}
.row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.row a{color:var(--link);text-decoration:none;font-weight:600}
.badge{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.badge.new{background:var(--newbg);color:var(--new);border-color:transparent;font-weight:700}
.badge.err{background:var(--errbg);color:var(--err);border-color:transparent}
.badge.ok{color:var(--ok)}
.when{color:var(--mute);font-size:12px;margin-left:auto}
details{margin-top:6px;font-size:13px}
summary{cursor:pointer;color:var(--mute)}
.chg{margin:6px 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.chg b{font-size:12px;color:var(--mute)}
.chg ul{margin:4px 0;padding-left:18px}
.chg li{word-break:break-word}
.err-msg{color:var(--err);font-size:12px;margin-top:4px}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Vuln Watch <span class="meta">PHP / Apache httpd / Tomcat / Node.js / OpenSSL / SSH</span></h1>
    <button id="seen">すべて既読にする</button>
  </div>
  <div class="meta" id="meta">読み込み中…</div>
  <div id="banner"></div>
  <div id="list"></div>
  <p class="meta">1時間ごとに各公式ページを取得し、前回との差分を検出します（NVD等のAPIは未使用）。「未確認」はこのブラウザで既読にしていない更新です。</p>
</main>
<script>
const KEY = "vulnwatch.seen.v1";
let seen = {};
try { seen = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const fmt = iso => iso ? new Date(iso).toLocaleString("ja-JP") : "-";
const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 60 ? m + "分前" : m < 1440 ? Math.floor(m / 60) + "時間前" : Math.floor(m / 1440) + "日前"; };
const isNew = s => s.last_changed && (!seen[s.id] || s.last_changed > seen[s.id]);

fetch("data/status.json?t=" + Date.now()).then(r => r.json()).then(d => {
  const all = d.products.flatMap(p => p.sources);
  const nNew = all.filter(isNew).length, nErr = all.filter(s => s.status === "error").length;
  const stale = (Date.now() - new Date(d.generated_at)) > 3 * 3600e3;
  $("meta").textContent = "最終クロール: " + fmt(d.generated_at) + "（" + ago(d.generated_at) + "）";
  document.title = (nNew ? "(" + nNew + ") " : "") + "Vuln Watch";
  const b = $("banner");
  if (stale) b.append(el("div", "banner warn", "3時間以上クロールが更新されていません。Actionsの実行状況を確認してください。"));
  if (nNew) b.append(el("div", "banner new", "未確認の更新が " + nNew + " 件あります。"));
  else b.append(el("div", "banner none", "未確認の更新はありません。"));
  if (nErr) b.append(el("div", "banner warn", "取得エラーのページが " + nErr + " 件あります。"));

  d.products.forEach(p => {
    const sec = el("section", "p"), h = el("h2", null, p.name);
    const n = p.sources.filter(isNew).length;
    if (n) h.append(el("span", "badge new", "未確認 " + n));
    sec.append(h);
    p.sources.forEach(s => {
      const box = el("div", "src"), row = el("div", "row");
      const a = el("a", null, s.title); a.href = s.url; a.target = "_blank"; a.rel = "noopener";
      row.append(a);
      if (isNew(s)) row.append(el("span", "badge new", "更新あり"));
      else if (s.status === "error") row.append(el("span", "badge err", "取得エラー"));
      else row.append(el("span", "badge ok", "変更なし"));
      row.append(el("span", "when", s.last_changed ? "最終変更 " + fmt(s.last_changed) : "変更履歴なし（基準取得 " + fmt(s.baseline_at) + "）"));
      box.append(row);
      if (s.status === "error") box.append(el("div", "err-msg", s.error + "（連続 " + s.consecutive_errors + " 回）"));
      if (s.changes && s.changes.length) {
        const det = el("details"); det.append(el("summary", null, "変更履歴 " + s.changes.length + " 件"));
        s.changes.forEach(c => {
          const w = el("div", "chg");
          w.append(el("b", null, fmt(c.at) + "　追加 " + c.added_total + " 行 / 削除 " + c.removed_total + " 行"));
          const ul = el("ul"); c.added.forEach(l => ul.append(el("li", null, l))); w.append(ul);
          if (c.added_total > c.added.length) w.append(el("div", "meta", "…ほか " + (c.added_total - c.added.length) + " 行"));
          det.append(w);
        });
        box.append(det);
      }
      sec.append(box);
    });
    $("list").append(sec);
  });
  $("seen").onclick = () => {
    all.forEach(s => { if (s.last_changed) seen[s.id] = s.last_changed; });
    try { localStorage.setItem(KEY, JSON.stringify(seen)); } catch (e) {}
    location.reload();
  };
}).catch(e => { $("meta").textContent = "status.json を読み込めません: " + e; });
</script>
</body>
</html>
